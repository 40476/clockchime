name: Build Multi-Platform

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install numpy sounddevice pyinstaller pystray pillow
    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name "ClockChime-Win" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Build
        path: dist/ClockChime-Win.exe

  build-linux-x86:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libasound2-dev
        pip3 install numpy sounddevice pyinstaller pystray pillow
    - name: Build Binary
      run: pyinstaller --noconsole --onefile --name "ClockChime-Linux-x86_64" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-x86_64
        path: dist/ClockChime-Linux-x86_64

  build-linux-arm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Binary (aarch64)
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu20.04
        install: |
          apt-get update
          apt-get install -y python3 python3-pip libportaudio2 libasound2-dev
          pip3 install numpy sounddevice pyinstaller pystray pillow
        run: |
          pyinstaller --noconsole --onefile --name "ClockChime-Linux-aarch64" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-aarch64
        path: dist/ClockChime-Linux-aarch64

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        buildozer_version: stable
        command: buildozer android debug
    - uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
