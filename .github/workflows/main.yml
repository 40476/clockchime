name: Build Cross-Platform Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        pip install numpy sounddevice pyinstaller pystray pillow
    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name "ClockChime-Windows" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-EXE
        path: dist/ClockChime-Windows.exe

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64, armv7l]
        include:
          - arch: x86_64
            target: x86_64
          - arch: aarch64
            target: arm64
          - arch: armv7l
            target: armhf
    steps:
    - uses: actions/checkout@v4
    
    # We use a Docker-based cross-compiler for Linux to ensure binaries work on older distros
    # and to handle the different architectures (ARM64/ARMHF) easily.
    - name: Build Linux Binary (${{ matrix.target }})
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: ${{ matrix.arch }}
        distro: ubuntu20.04
        githubToken: ${{ github.token }}
        install: |
            apt-get update
            apt-get install -y python3 python3-pip libportaudio2 libasound2-dev
            pip3 install numpy sounddevice pyinstaller pystray pillow
        run: |
            pyinstaller --noconsole --onefile --name "ClockChime-Linux-${{ matrix.target }}" clockchime.py

    - uses: actions/upload-artifact@v4
      with:
        name: Linux-Binary-${{ matrix.target }}
        path: dist/ClockChime-Linux-${{ matrix.target }}
