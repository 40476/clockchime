name: Build Multi-Platform

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install numpy sounddevice pyinstaller pystray pillow
    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name "ClockChime-Win" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Build
        path: dist/ClockChime-Win.exe

  build-linux-x86:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libasound2-dev
    - name: Install Python dependencies
      run: pip install numpy sounddevice pyinstaller pillow
    - name: Build Linux Binary
      run: pyinstaller --noconsole --onefile --name "ClockChime-Linux-x64" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-x86-Build
        path: dist/ClockChime-Linux-x64

  build-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Build in Docker (ARM64)
      run: |
        docker run --rm -v ${{ github.workspace }}:/src arm64v8/ubuntu:22.04 /bin/bash -c "
          apt-get update && 
          apt-get install -y python3 python3-pip libportaudio2 libasound2-dev build-essential &&
          pip3 install numpy sounddevice pyinstaller pillow &&
          cd /src &&
          pyinstaller --noconsole --onefile --name 'ClockChime-Linux-ARM64' clockchime.py
        "
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-ARM64-Build
        path: dist/ClockChime-Linux-ARM64

  build-android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev libportaudio2 libasound2-dev \
          pkg-config libgl1-mesa-dev libgles2-mesa-dev zlib1g-dev \
          openjdk-17-jdk zip unzip autoconf libtool libssl-dev cmake ant
    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install --user --upgrade buildozer cython==0.29.33
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Build Android APK
      run: |
        # Fix for the 'stringop-overflow' warning being treated as an error in hostpython3
        export CFLAGS="$CFLAGS -Wno-error=stringop-overflow -Wno-error=format-overflow"
        export ANDROID_NDK_HOME=""
        buildozer android debug
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
