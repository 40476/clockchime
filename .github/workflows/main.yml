name: Build Multi-Platform

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: pip install numpy sounddevice pyinstaller pystray pillow
    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name "ClockChime-Win" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-Build
        path: dist/ClockChime-Win.exe

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
    - uses: actions/checkout@v4
    - name: Build Binary
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: ${{ matrix.arch }}
        distro: ubuntu20.04
        install: |
          apt-get update
          apt-get install -y python3 python3-pip libportaudio2 libasound2-dev
          pip3 install numpy sounddevice pyinstaller pystray pillow
        run: |
          pyinstaller --noconsole --onefile --name "ClockChime-Linux-${{ matrix.arch }}" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-${{ matrix.arch }}
        path: dist/ClockChime-Linux-${{ matrix.arch }}

  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build with Buildozer
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        buildozer_version: master
        python_version: 3.10
    - uses: actions/upload-artifact@v4
      with:
        name: Android-APK
        path: bin/*.apk
