name: Build Cross-Platform Binaries

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install Dependencies
      run: |
        pip install numpy sounddevice pyinstaller pystray pillow
    - name: Build EXE
      run: pyinstaller --noconsole --onefile --name "ClockChime-Windows" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Windows-EXE
        path: dist/ClockChime-Windows.exe

  build-linux-native:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libportaudio2 libasound2-dev
    - name: Install Python Dependencies
      run: |
        pip install numpy sounddevice pyinstaller pystray pillow
    - name: Build Linux Binary (x86_64)
      run: pyinstaller --noconsole --onefile --name "ClockChime-Linux-x86_64" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-Binary-x86_64
        path: dist/ClockChime-Linux-x86_64

  build-linux-arm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, armv7]
        include:
          - arch: aarch64
            target: arm64
          - arch: armv7
            target: armhf
    steps:
    - uses: actions/checkout@v4
    - name: Build Linux Binary (${{ matrix.target }})
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: ${{ matrix.arch }}
        distro: ubuntu20.04
        githubToken: ${{ github.token }}
        setup: |
          mkdir -p "${PWD}/artifacts"
        install: |
          apt-get update
          apt-get install -y python3 python3-pip libportaudio2 libasound2-dev
          pip3 install numpy sounddevice pyinstaller pystray pillow
        run: |
          pyinstaller --noconsole --onefile --name "ClockChime-Linux-${{ matrix.target }}" clockchime.py
    - uses: actions/upload-artifact@v4
      with:
        name: Linux-Binary-${{ matrix.target }}
        path: dist/ClockChime-Linux-${{ matrix.target }}
